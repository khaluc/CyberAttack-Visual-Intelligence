<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#07101f">
  <title>CyberVision AI</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='settings.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='phase1.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='phase2.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='phase3.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='phase4.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='phase5.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='diagram.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='confidence.css') }}">
</head>
<body>
  <div id="app"></div>
  <script>window.CYBER_SAMPLE = {{ sample|tojson }};</script>
  <script>
    window.addEventListener("error", function (event) {
      var app = document.getElementById("app");
      if (app && !app.innerHTML) {
        app.innerHTML = '<div style="padding:24px;color:#ff9aa7;font:14px monospace">' +
          'Frontend error: ' + String(event.message) + ' (' + String(event.lineno) + ':' +
          String(event.colno) + ')</div>';
      }
    });
  </script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
